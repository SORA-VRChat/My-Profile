<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sora's Portal | 活動まとめ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="site-logo">SORA<span>.</span>PORTAL</a>
    <nav>
      <a href="index.html" class="active">Top</a>
      <a href="events.html">Events</a>
      <a href="avatars.html">Avatars</a>
    </nav>
  </header>

  <main>
    <!-- プロフィール -->
    <section class="profile-hero">
      <img src="assets/profile.png" alt="プロフィールアイコン" class="profile-avatar">
      <h1 class="profile-name">ソラ</h1>
      <p class="profile-role">VRChat / Event Cast & Creator</p>
      <p class="profile-bio">
        VRChatを中心にイベントキャスト活動やダンス動画撮影などを楽しんでいます。<br>
        所属しているイベントやお気に入りのアバターをまとめました。
      </p>
      <div class="sns-links">
        <a href="https://x.com/" target="_blank" rel="noopener" class="sns-pill">𝕏 X (Twitter)</a>
        <a href="https://vrchat.com/" target="_blank" rel="noopener" class="sns-pill">VRChat</a>
      </div>
    </section>

    <!-- 各ページへのナビゲーション -->
    <section class="portal-grid">
      <a href="events.html" class="portal-card">
        <div>
          <span class="portal-card-en">EVENTS</span>
          <h2>所属Event一覧</h2>
          <p>キャストとして参加中のイベント紹介</p>
        </div>
        <span class="portal-arrow">→</span>
      </a>

      <a href="avatars.html" class="portal-card">
        <div>
          <span class="portal-card-en">AVATARS</span>
          <h2>お気に入りアバター</h2>
          <p>普段愛用しているアバターや改変のまとめ</p>
        </div>

      </a>
    </section>

  <footer>
    <p>SORA PORTAL</p>
  </footer>

</html>
