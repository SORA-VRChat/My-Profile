<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フレア -Flare- | SORA.PORTAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="site-logo">SORA<span>.</span>PORTAL</a>
    <nav>
      <a href="index.html">Top</a>
      <a href="events.html">Events</a>
      <a href="avatars.html" class="active">Avatars</a>
    </nav>
  </header>

  <main>
    <div class="detail-container">
      <!-- 左側：縦長画像ギャラリー（5枚対応） -->
      <div class="detail-gallery">
        <div class="main-image-box">
          <button class="slide-btn prev" onclick="changeSlide(-1)">&#8249;</button>
          <img id="main-photo" src="assets/avatar01-1.png" alt="フレア 写真1">
          <button class="slide-btn next" onclick="changeSlide(1)">&#8250;</button>
        </div>
        <div class="thumb-list">
          <img src="assets/avatar01-1.png" alt="写真1" class="thumb active" onclick="selectPhoto(0)">
          <img src="assets/avatar01-2.png" alt="写真2" class="thumb" onclick="selectPhoto(1)">
          <img src="assets/avatar01-3.png" alt="写真3" class="thumb" onclick="selectPhoto(2)">
          <img src="assets/avatar01-4.png" alt="写真4" class="thumb" onclick="selectPhoto(3)">
          <img src="assets/avatar01-5.png" alt="写真5" class="thumb" onclick="selectPhoto(4)">
        </div>
      </div>

      <!-- 右側：アバター情報 -->
      <div class="detail-info">
        <!-- アバター名（英語名を下に配置） -->
        <h1 class="detail-avatar-name">
          フレア
          <span class="detail-avatar-sub">-Flare-</span>
        </h1>

        <!-- アバター説明文 -->
        <p class="detail-description">
          初めてお迎えしたアバター。魂の形はフレアちゃん。<br>
          「てんしのふれあい」というメイドカフェイベントでもアバター使用している。<br>
          お友達に描いてもらったVRChatやXアカウントのアイコンもフレアちゃん。
        </p>

        <!-- Shop名ボックス（クリックでBOOTHへリンク） -->
        <div class="info-box">
          <div class="info-row">
            <span class="info-label">Shop</span>
            <span class="info-value">
              <a href="https://booth.pm/ja/items/4768506" target="_blank" rel="noopener noreferrer" class="booth-link">
                Elychiffon ↗
              </a>
            </span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SORA PORTAL</p>
  </footer>

  <!-- 画像切り替え用JavaScript（5枚対応） -->
  <script>
    const photos = [
      "assets/avatar01-1.png",
      "assets/avatar01-2.png",
      "assets/avatar01-3.png",
      "assets/avatar01-4.png",
      "assets/avatar01-5.png"
    ];
    let currentIndex = 0;

    function selectPhoto(index) {
      currentIndex = index;
      document.getElementById("main-photo").src = photos[currentIndex];
      const thumbs = document.querySelectorAll(".thumb");
      thumbs.forEach((thumb, i) => {
        thumb.classList.toggle("active", i === currentIndex);
      });
    }

    function changeSlide(step) {
      currentIndex = (currentIndex + step + photos.length) % photos.length;
      selectPhoto(currentIndex);
    }
  </script>
</body>
</html>
